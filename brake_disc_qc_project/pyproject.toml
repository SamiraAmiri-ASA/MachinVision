[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brake-disc-qc"
version = "0.1.0"
description = "Automated brake disc quality control: geometry, measurement, surface defects"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
brake-disc-qc = "cli.inspect:main"

[tool.setuptools.packages.find]
include = ["brake_disc_qc*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
